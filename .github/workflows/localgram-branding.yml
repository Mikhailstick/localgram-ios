name: Check LocalGram branding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore rendering sources
        run: python3 bootstrap.py --destination client --skip-submodules
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - name: Render production branding
        timeout-minutes: 6
        run: python3 client/LocalGifts/render_branding_preview.py
      - name: Export preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalGram-branding-preview
          path: client/LocalGifts/artifacts/branding
          if-no-files-found: warn
          retention-days: 7
