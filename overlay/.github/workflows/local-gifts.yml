name: Build LocalGram IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac runner with Xcode 26.2 installed"
        required: true
        default: "macos-26"
        type: string
      bundle_id:
        description: "App bundle identifier"
        required: true
        default: "dev.localgram.client"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      LOCALGIFTS_BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Select the pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_required="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          xcode_path="/Applications/Xcode_$xcode_required.app/Contents/Developer"
          if [[ ! -d "$xcode_path" ]]; then
            echo "This runner must have Xcode $xcode_required. Choose a matching Mac runner."
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sources
        run: |
          python3 -m pip install -r LocalGifts/requirements-validation.txt
          python3 LocalGifts/validate_sources.py
      - uses: actions/cache@v4
        with:
          path: ~/localgram-bazel-cache
          key: localgram-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}
      - name: Test the ledger and build a device IPA
        run: python3 LocalGifts/build_ipa.py --build-number ${{ github.run_number }}
      - name: Upload the compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalGram-unsigned-IPA
          path: LocalGifts/artifacts/LocalGram-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
